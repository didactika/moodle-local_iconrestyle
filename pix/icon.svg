<linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a3ced1"/><stop offset="1" stop-color="#7eb8bd"/></linearGradient>
<linearGradient id="spark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#68bfc0"/><stop offset="0.55" stop-color="#55adaf"/><stop offset="1" stop-color="#409698"/></linearGradient>
</defs>
