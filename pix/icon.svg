<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="40 40 440 440" role="img" aria-labelledby="title desc">
<title id="title">Icon Restyle</title>
<desc id="desc">A card with four icons of different shapes and colours, and a spark that marks the icons as restyled, in the teal of Didactika.</desc>
